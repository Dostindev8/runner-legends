name: Unity CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Requires repo secrets: UNITY_LICENSE (or UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD).
# Build/EditMode tests run via game-ci. A red build blocks merge (prompt §2.1).
jobs:
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: unity/RunnerLegends/Library
          key: Library-${{ hashFiles('unity/RunnerLegends/Assets/**', 'unity/RunnerLegends/Packages/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity/RunnerLegends
          testMode: EditMode

  build:
    name: Android build (smoke)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with:
          path: unity/RunnerLegends/Library
          key: Library-${{ hashFiles('unity/RunnerLegends/Assets/**', 'unity/RunnerLegends/Packages/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity/RunnerLegends
          targetPlatform: Android
